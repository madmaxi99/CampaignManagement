services:
  nginx:
    image: nginx:latest
    ports:
      - "8090:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: ./backend
    user: "${UID}:${GID}"
    env_file: ../.env
    environment:
      PHP_IDE_CONFIG: "serverName=docker"
      COMPOSER_HOME: /var/www/.composer
    volumes:
      - ../backend:/var/www/html:rw
      - composer:/var/www/.composer:rw
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    env_file: ../.env
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed_aodhan.sql:/docker-entrypoint-initdb.d/02_seed_aodhan.sql:ro
      - ../database/seed_pregens.sql:/docker-entrypoint-initdb.d/03_seed_pregens.sql:ro
      - ../database/seed_ridderhohe.sql:/docker-entrypoint-initdb.d/04_seed_ridderhohe.sql:ro
      - ../database/seed_versinkender_turm.sql:/docker-entrypoint-initdb.d/05_seed_versinkender_turm.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8091:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: "${DB_USER}"
      PMA_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  composer:
  mariadb_data:
