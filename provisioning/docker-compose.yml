services:
  nginx:
    image: nginx:latest
    ports:
      - "8090:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: ./backend
    user: "${UID}:${GID}"
    env_file: ../.env
    environment:
      PHP_IDE_CONFIG: "serverName=docker"
      COMPOSER_HOME: /var/www/.composer
    volumes:
      - ../backend:/var/www/html:rw
      - composer:/var/www/.composer:rw
    working_dir: /var/www/html
    depends_on: []

volumes:
  composer:
